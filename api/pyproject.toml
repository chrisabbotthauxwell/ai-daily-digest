[project]
name = "ai-daily-digest-api"
version = "0.1.0"
description = "AI Daily Digest FastAPI BFF"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
